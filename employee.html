<!DOCTYPE html>
<html>
<head>
    <title>Employee Performance Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #11998e;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #11998e;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #087f73;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #11998e;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💼 Employee Performance Prediction</h1>

    <p class="subtitle">
        Enter employee professional details
    </p>

    <form action="/employee/predict/" method="get">

        <label>Age</label>
        <input type="number" name="age" min="18" max="70" required>

        <label>Experience (Years)</label>
        <input type="number" name="experience" step="0.1" min="0" max="50" required>

        <label>Working Hours per Day</label>
        <input type="number" name="working_hours" step="0.1" min="1" max="24" required>

        <label>Projects Completed</label>
        <input type="number" name="projects" min="0" max="100" required>

        <label>Attendance (%)</label>
        <input type="number" name="attendance" step="0.1" min="0" max="100" required>

        <label>Training Hours</label>
        <input type="number" name="training_hours" step="0.1" min="0" max="100" required>

        <label>Previous Performance (%)</label>
        <input type="number" name="previous_performance" step="0.1" min="0" max="100" required>

        <label>Overtime Hours</label>
        <input type="number" name="overtime" step="0.1" min="0" max="100" required>

        <label>Job Satisfaction (1-10)</label>
        <input type="number" name="satisfaction" min="1" max="10" required>

        <label>Participation (1-10)</label>
        <input type="number" name="participation" min="1" max="10" required>

        <button type="submit">
            Predict Performance 🚀
        </button>

    </form>

    <a class="back" href="/">← Back to Home</a>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Smart Performance Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            text-align: center;
            padding-top: 70px;
        }

        h1 {
            color: white;
            font-size: 42px;
        }

        p {
            color: white;
            font-size: 18px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .card {
            background: white;
            width: 300px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
        }

        .card a {
            display: inline-block;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 15px;
        }

        .employee a {
            background: #20a779;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Smart Performance Prediction</h1>

    <p>Machine Learning Based Performance Prediction System</p>

    <div class="cards">

        <div class="card">
            <h2>🎓 Student</h2>
            <p style="color:#555;">
                Predict student academic performance using Machine Learning.
            </p>

            <a href="/student/">Predict Student</a>
        </div>


        <div class="card employee">
            <h2>💼 Employee</h2>
            <p style="color:#555;">
                Predict employee performance using Machine Learning.
            </p>

            <a href="/employee/">Predict Employee</a>
        </div>

    </div>

</div>

</body>
</html>

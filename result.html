<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            
            justify-content: center;
        }

        .result-box {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            color: #444;
        }

        .score {
            font-size: 60px;
            font-weight: bold;
            color: #667eea;
            margin: 20px;
        }

        .level {
            font-size: 25px;
            font-weight: bold;
            color: #11998e;
        }

        .suggestions {
            text-align: left;
            margin-top: 25px;
            line-height: 2;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="result-box">

    <h1>{{ type }} Performance Result</h1>

    <div class="score">
        {{ score }}%
    </div>

    <div class="level">
        {{ level }}
    </div>

    <div class="suggestions">

        <h3>💡 Suggestions</h3>

        <ul>
            {% for suggestion in suggestions %}
                <li>{{ suggestion }}</li>
            {% endfor %}
        </ul>

    </div>

    <a href="/">← Back to Home</a>

</div>

</body>
</html>

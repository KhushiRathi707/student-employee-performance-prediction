<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #4f46a5;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #4f46a5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #667eea;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Performance Prediction</h1>

    <p class="subtitle">
        Enter your academic details
    </p>

    <form action="/student/predict/" method="get">

        <label>Age</label>
        <input type="number" name="age" min="15" max="60" required>

        <label>Study Hours per Day</label>
        <input type="number" name="study_hours" step="0.1" min="0" max="15" required>

        <label>Attendance (%)</label>
        <input type="number" name="attendance" step="0.1" min="0" max="100" required>

        <label>Previous Marks (%)</label>
        <input type="number" name="previous_marks" step="0.1" min="0" max="100" required>

        <label>Assignment Score (%)</label>
        <input type="number" name="assignment_score" step="0.1" min="0" max="100" required>

        <label>Quiz Score (%)</label>
        <input type="number" name="quiz_score" step="0.1" min="0" max="100" required>

        <label>Number of Backlogs</label>
        <input type="number" name="backlogs" min="0" max="20" required>

        <label>Extra Activities</label>
        <input type="number" name="activities" min="0" max="10" required>

        <label>Sleep Hours per Day</label>
        <input type="number" name="sleep_hours" step="0.1" min="0" max="15" required>

        <button type="submit">
            Predict Performance 🚀
        </button>

    </form>

    <a class="back" href="/">← Back to Home</a>

</div>

</body>
</html>
